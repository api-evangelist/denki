aid: denki
name: Denki
description: >-
  Denki is a full-stack AI financial audit firm that automates internal audit
  work — planning, control testing, evidence collection, walkthrough interviews,
  and documentation — so teams can comply with financial regulations such as SOX
  404 and BSA/AML. Its Tracer agent links general ledger, sub-ledgers, ERP, and
  payments data into a single audit trail, detecting anomalies early and
  producing ready-to-share audit packs. Denki works alongside existing systems
  such as AuditBoard, Workiva, and ERPs, and is built for audit teams at pre-IPO
  and publicly listed companies. Founded in 2025 by brothers Felipe and David
  Jin Li, Denki is a Y Combinator (F25) company that raised $4.1M led by Base10
  Partners and Shine Capital.
